workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web"'

stages:
  - verify
  - docs
  - docker

default:
  interruptible: true

variables:
  DO_NOT_TRACK: "true"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.cache/npm"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PLAYWRIGHT_BROWSERS_PATH: "$CI_PROJECT_DIR/.cache/ms-playwright"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"

.python-job:
  image: python:3.13-bookworm
  cache:
    key:
      files:
        - uv.lock
      prefix: python-3.13
    paths:
      - .cache/pip
      - .cache/uv
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends build-essential git make
    - rm -rf /var/lib/apt/lists/*
    - python -m pip install --upgrade pip uv

.node-job:
  image: node:22-bookworm
  before_script:
    - cd src/frontend
    - npm ci --cache "$NPM_CONFIG_CACHE" --prefer-offline
  cache:
    key:
      files:
        - src/frontend/package-lock.json
      prefix: node-22-frontend
    paths:
      - .cache/npm

.docs-job:
  image: node:22-bookworm
  before_script:
    - cd docs
    - npm ci --cache "$NPM_CONFIG_CACHE" --prefer-offline
  cache:
    key:
      files:
        - docs/package-lock.json
      prefix: node-22-docs
    paths:
      - .cache/npm

backend:lint:
  stage: verify
  extends: .python-job
  script:
    - uv sync --frozen
    - uv run ruff check .
    - uv run ruff format . --check

backend:typecheck:
  stage: verify
  extends: .python-job
  script:
    - uv sync --frozen
    - uv run mypy --namespace-packages -p langflow

backend:unit-tests:
  stage: verify
  extends: .python-job
  parallel: 5
  script:
    - python3 scripts/generate_coverage_config.py
    - make unit_tests async=false ff=false args="-x -vv --splits $CI_NODE_TOTAL --group $CI_NODE_INDEX --cov --cov-config=src/backend/.coveragerc --cov-report=xml"
  artifacts:
    when: always
    paths:
      - coverage.xml

frontend:verify:
  stage: verify
  extends: .node-job
  script:
    - npx @biomejs/biome check
    - npm run test -- --ci --runInBand
    - npm run build

docs:build:
  stage: docs
  extends: .docs-job
  script:
    - npm run build
  artifacts:
    paths:
      - docs/build/
    expire_in: 7 days

docker:smoke:
  stage: docker
  image: docker:27.5.1
  services:
    - name: docker:27.5.1-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache bash coreutils grep
  script:
    - docker build -t idrflow:gitlab-smoke -f docker/build_and_push.Dockerfile .
    - expected_version="$(grep '^version' pyproject.toml | head -n 1 | cut -d '"' -f 2)"
    - actual_version="$(docker run --rm --entrypoint bash idrflow:gitlab-smoke -lc "python -c 'from langflow.utils.version import get_version_info; print(get_version_info()[\"version\"])'")"
    - test "$expected_version" = "$actual_version"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Publish and release jobs stay out of the initial GitLab pipeline until the
# internal registry path, credentials, and approval flow are finalized.
