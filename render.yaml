services:
  # A Docker web service
  - type: web
    name: idrflow
    runtime: docker
    dockerfilePath: ./docker/render.Dockerfile
    # Upstream-compatible repository reference until idrflow source publishing is available.
    repo: https://github.com/langflow-ai/langflow
    branch: main
    plan: standard
    healthCheckPath: /health_check
    autoDeploy: false
    envVars:
      - key: IDRFLOW_DATABASE_URL
        value: sqlite:////app/data/.cache/langflow/langflow.db
      - key: IDRFLOW_HOST
        value: 0.0.0.0
      - key: IDRFLOW_PORT
        # default render port https://docs.render.com/web-services#port-binding
        value: 10000
      - key: IDRFLOW_LOG_LEVEL
        value: INFO
    disk:
      name: idrflow-data
      mountPath: /app/data
